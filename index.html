<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed Sorter</title>
  <meta name="description" content="A colorful 3D seed sorting game." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <div class="sky-glow"></div>
    <header class="hud glass">
      <div>
        <div class="eyebrow">🌱 GARDEN WORKSHOP</div>
        <h1>Seed Sorter</h1>
        <p>Sort every seed into the right tray!</p>
      </div>
      <div class="stats">
        <div><span>ROUND</span><strong id="round">1</strong></div>
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>STREAK</span><strong id="streak">0</strong></div>
      </div>
    </header>

    <section class="game-board">
      <div class="instruction glass"><span id="message">Click a seed, then click its matching tray.</span></div>

      <div class="seed-bowl">
        <div class="bowl-rim"></div>
        <div id="seeds" class="seeds"></div>
        <div class="bowl-label">SEED BIN</div>
      </div>

      <div class="trays" id="trays"></div>
    </section>

    <footer class="controls glass">
      <button id="newRound" class="primary">🌿 New Round</button>
      <div class="legend">Match by <b>shape + color</b> · Wrong guesses cost a little streak</div>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
